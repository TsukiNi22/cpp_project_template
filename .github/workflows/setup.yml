name: CI - Setup

on:
  push:
    branches: [main]

env:
  # Names for testing purpose only
  PROJECT_NAME: "testing"
  CORE_NAME: "Test"

jobs:
  setup-template:
    runs-on: ${{ vars.RUNNER }}
    defaults:
      run:
        shell: bash

    container:
      image: ghcr.io/tsukini22/ci:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          path: template

      # Run the setup of the pushed commit (the raw main file can be cached/outdated)
      - name: Setup repository
        run: |
          set -euo pipefail
          mv template "$RUNNER_TEMP/template" # Out of the setup directory (would be renamed too)
          TEMPLATE_DIR="$RUNNER_TEMP/template" bash "$RUNNER_TEMP/template/setup.sh" "$PROJECT_NAME" "$CORE_NAME"
        timeout-minutes: 2

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: /github/home/.cache/ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('**/*.cpp', '**/*.hpp', 'cmake/config/exceptions/*.json', 'CMakeLists.txt') }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Build executables
        run: |
          set -e
          make re
        timeout-minutes: 2

      - name: Show ccache stats
        run: ccache -s

      - name: Check executables
        run: |
          set -euo pipefail
          if [ ! -f "./$PROJECT_NAME" ]; then
            echo "::error title=Missing executable,file=$PROJECT_NAME::Executable '$PROJECT_NAME' not found"
            exit 1
          fi
          if [ ! -x "$PROJECT_NAME" ]; then
            echo "::error title=Permission error,file=$PROJECT_NAME::Executable '$PROJECT_NAME' has no execution permission"
            exit 1
          fi
          echo "✓ Executable '$PROJECT_NAME' ok"
