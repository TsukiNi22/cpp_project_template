name: Build CI image

on:
  push:
    paths:
      - '.github/docker/Dockerfile'
    branches: [main]

jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GIT_TOKEN }}
      - run: |
          REPOSITORY_OWNER_LOWERCASE=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker build -t ghcr.io/$REPOSITORY_OWNER_LOWERCASE/ci:latest -f .github/docker/Dockerfile docker/
          docker push ghcr.io/$REPOSITORY_OWNER_LOWERCASE/ci:latest
