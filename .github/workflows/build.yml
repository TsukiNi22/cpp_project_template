name: Build executables

on:
  workflow_run:
    workflows: ["Build CI image"]
    types: [completed]
  push:
    branches: [main]
    paths-ignore:
      - '.github/docker/Dockerfile'
  pull_request:
    branches: [main]

env:
  EXECUTABLES: "project"

jobs:
  docker-changes:
    runs-on: ubuntu-latest
    permissions:
      checks: write
    outputs:
      dockerfile: ${{ steps.filter.outputs.dockerfile }}

    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            dockerfile:
              - '.github/docker/Dockerfile'
      - name: Report skipped as neutral check
        if: steps.filter.outputs.dockerfile == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'build-executables',
              head_sha: context.sha,
              status: 'completed',
              conclusion: 'neutral',
              output: {
                title: 'Build skipped',
                summary: 'Skipped because .github/docker/Dockerfile was modified in this push.'
              }
            });

  build-executables:
    needs: docker-changes
    if: needs.docker-changes.outputs.dockerfile == 'false'

    #runs-on: self-hosted
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    container:
      image: ghcr.io/tsukini22/ci:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build executables
        run: |
          set -e
          make re
        timeout-minutes: 2

      - name: Check executables
        run: |
          set -euo pipefail

          for executable in $(echo $EXECUTABLES | tr ',' ' ' | xargs); do
            if [ ! -f "./$executable" ]; then
              echo "::error title=Missing executable, file=$executable::Executable '$executable' not found"
              exit 1
            fi

            if [ ! -x "$executable" ]; then
              echo "::error title=Permission error,file=$executable::Executable '$executable' has no execution permission"
              exit 1
            fi

            echo "✓ Executable '$executable' ok"
          done
