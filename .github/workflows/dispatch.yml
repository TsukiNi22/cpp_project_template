name: Dispatch (CI/CD)

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - '**.txt'
      - 'docs/**'

permissions:
  actions: write

jobs:
  dispatch:
    # Don't run on template repository
    if: github.repository != 'TsukiNi22/cpp_project_template'

    runs-on: ${{ vars.RUNNER }}
    defaults:
      run:
        shell: bash

    outputs:
      build: ${{ steps.decide.outputs.build }}
      stable: ${{ steps.decide.outputs.stable }}
      release: ${{ steps.decide.outputs.release }}
      ignore: ${{ steps.decide.outputs.ignore }}

    steps:
      - name: Determine branches
        id: decide
        run: |
          set -e
          MESSAGE_HAS_IGNORE='${{ contains(github.event.head_commit.message, '[ignore]') }}'
          MESSAGE_HAS_BUILD='${{ contains(github.event.head_commit.message, '[build]') }}'
          MESSAGE_HAS_RELEASE='${{ contains(github.event.head_commit.message, '[release]') }}'

          # Determine branches
          if [[ "${{ github.ref_type }}" == "tag" ]]; then # On tag push
            if [[ "${{ github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              BUILD=true; STABLE=ON; RELEASE=true
            elif [[ "${{ github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-.+$ ]]; then
              BUILD=true; STABLE=OFF; RELEASE=false
            else
              BUILD=false; STABLE=OFF; RELEASE=false
            fi
            IGNORE=false
          else # On normal push
            [[ "$MESSAGE_HAS_BUILD" == "true" ]] && BUILD=true || BUILD=false
            [[ "$MESSAGE_HAS_RELEASE" == "true" ]] && RELEASE=true || RELEASE=false
            [[ "$MESSAGE_HAS_IGNORE" == "true" ]] && IGNORE=true || IGNORE=false
            STABLE=OFF
          fi

          # Store result & display them
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "stable=$STABLE" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "ignore=$IGNORE" >> "$GITHUB_OUTPUT"
          echo "Decision: build=$BUILD stable=$STABLE release=$RELEASE ignore=$IGNORE"

  notify-unit-tests:
    needs: dispatch
    if: needs.dispatch.outputs.ignore == 'false'

    runs-on: ${{ vars.RUNNER }}

    steps:
      - name: Trigger unit-tests.yml and wait
        uses: convictional/trigger-workflow-and-wait@v1.6.5
        with:
          owner: ${{ github.repository_owner }}
          repo: ${{ github.event.repository.name }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow_file_name: unit-tests.yml
          ref: ${{ github.ref_name }}
          wait_interval: 4
          propagate_failure: true

  notify-build:
    needs: [dispatch, notify-unit-tests]
    if: needs.dispatch.outputs.ignore == 'false' && needs.dispatch.outputs.build == 'false' && needs.notify-unit-tests.result == 'success'

    runs-on: ${{ vars.RUNNER }}

    steps:
      - name: Trigger build.yml and wait
        uses: convictional/trigger-workflow-and-wait@v1.6.5
        with:
          owner: ${{ github.repository_owner }}
          repo: ${{ github.event.repository.name }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow_file_name: build.yml
          ref: ${{ github.ref_name }}
          wait_interval: 4
          propagate_failure: true

  notify-build-packages:
    needs: [dispatch, notify-unit-tests]
    if: needs.dispatch.outputs.ignore == 'false' && needs.dispatch.outputs.build == 'true' && needs.notify-unit-tests.result == 'success'

    runs-on: ${{ vars.RUNNER }}

    steps:
      - name: Trigger build-packages.yml (workflow_dispatch) and wait
        uses: convictional/trigger-workflow-and-wait@v1.6.5
        with:
          owner: ${{ github.repository_owner }}
          repo: ${{ github.event.repository.name }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow_file_name: build-packages.yml
          ref: ${{ github.ref_name }}
          wait_interval: 4
          propagate_failure: true
          client_payload: '{"stable": "${{ needs.dispatch.outputs.stable }}"}'

  notify-release:
    # GitHub release of a tag (notes = section of the CHANGELOG), once its packages are published
    needs: [dispatch, notify-build-packages]
    if: github.ref_type == 'tag' && needs.dispatch.outputs.ignore == 'false' && needs.notify-build-packages.result == 'success'

    runs-on: ${{ vars.RUNNER }}

    steps:
      - name: Trigger release.yml (workflow_dispatch) and wait
        uses: convictional/trigger-workflow-and-wait@v1.6.5
        with:
          owner: ${{ github.repository_owner }}
          repo: ${{ github.event.repository.name }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow_file_name: release.yml
          ref: ${{ github.ref_name }}
          wait_interval: 4
          propagate_failure: true

  # Example of a downstream notification (like libutils -> docker-image): after a package publication, or a
  # commit containing [release]. The receiving repository listens with 'on: repository_dispatch: types: [<event>]',
  # the token (secret) needs the 'repo' scope on it. Uncomment and set the repository / event to use it.
